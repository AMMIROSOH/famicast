# Release archives: nes (interpreter), nes_headless, nesrecomp and the
# recompile kit (prebuilt SDL3), one per platform (tools/make_release.py).
# A pushed tag v* builds them and creates a draft GitHub Release to review
# and publish; a manual run (Actions tab) or a push to a release/** branch
# only uploads them as artifacts (a test run before tagging).
name: release
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x64}
          - {os: windows-11-arm, name: windows-arm64}
          - {os: ubuntu-22.04, name: linux-x64}       # 22.04: runs on glibc 2.35 and newer
          - {os: ubuntu-22.04-arm, name: linux-arm64}
          - {os: macos-latest, name: macos-arm64}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # headers for SDL3's X11/Wayland video and ALSA/PulseAudio/PipeWire audio
      # (loaded at run time, so the programs start without the ones not installed)
      - name: SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev
      - name: Build, check the kit, package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          python tools/make_release.py --name "retrocast-$v-${{ matrix.name }}" --out out/dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7  # .github/release-notes.md only
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # the general text from .github/release-notes.md, then GitHub's list of merged PRs
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "retrocast $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
