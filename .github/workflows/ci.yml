# Build and test on Linux (GCC, Clang) and Windows (MSVC). Public test ROMs
# only (fetched by tests/fetch_test_roms.py); no game ROMs, so the tests of
# recompiled games skip. SingleStepTests (~1 GB) are not downloaded here.
name: ci
on: [push, pull_request]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc}
          - {os: ubuntu-latest, cc: clang}
          - {os: windows-latest, cc: cl}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch public test ROMs
        run: python tests/fetch_test_roms.py
      # headless: the SDL3 frontend needs X11/Wayland dev packages on Linux
      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DNES_FRONTEND=OFF
          cmake --build build
      - name: Configure and build (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        # MSVC environment from Visual Studio itself (vswhere ships with it)
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DNES_FRONTEND=OFF || exit /b 1
          cmake --build build
      - name: Test
        run: python -m unittest discover -s tests -t . -v
